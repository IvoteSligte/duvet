[package]
name = "duvet"
version = "0.1.0"
edition = "2024"

[dependencies]
nvenc = { git = "https://github.com/IvoteSligte/nvenc.git", version = "0.2.1" }
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-capture = "2.0.1"
fps_ticker = { git = "https://github.com/IvoteSligte/fps_ticker.git", version = "1.0.0" }
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
